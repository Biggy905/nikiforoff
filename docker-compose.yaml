services:
  nikiforoff-nginx:
    container_name: nikiforoff-nginx
    image: nginx:stable-alpine
    volumes:
      - ./Docker/nginx/docker.conf:/etc/nginx/conf.d/default.conf
      - ./:/app
    ports:
      - "3000:3000"
    depends_on:
      - nikiforoff-php

  nikiforoff-php:
    container_name: nikiforoff-php
    build:
      context: .
      dockerfile: Docker/php/PHP_FPM
    volumes:
      - ./:/app
    restart: unless-stopped
    environment:
      PHP_IDE_CONFIG: "serverName=nikiforoff"

networks:
  default:
    external: true
    name: nikiforoff-network
